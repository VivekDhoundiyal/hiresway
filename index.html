<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HiresWay — The Smarter Way to Get Hired</title>
    <!-- Modern Sans font Inter from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background text-text-primary antialiased selection:bg-primary-soft selection:text-primary min-h-screen">
    <div id="root">
      <!-- Instant 0ms Zero-Flash App Shell Pre-Render -->
      <style>
        @keyframes cos-pulse {
          0%, 100% { opacity: 0.95; }
          50% { opacity: 0.55; }
        }
        .cos-pre-shell {
          display: flex;
          height: 100vh;
          width: 100vw;
          overflow: hidden;
          background-color: #f8fafc;
          font-family: 'Inter', system-ui, -apple-system, sans-serif;
          color: #1e293b;
        }
        .cos-pre-sidebar {
          width: 256px;
          height: 100vh;
          background-color: #ffffff;
          border-right: 1px solid #e2e8f0;
          display: flex;
          flex-direction: column;
          flex-shrink: 0;
        }
        .cos-pre-topbar {
          height: 64px;
          background-color: #ffffff;
          border-bottom: 1px solid #e2e8f0;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 28px;
          flex-shrink: 0;
        }
        .cos-pre-main {
          flex: 1;
          display: flex;
          flex-direction: column;
          min-width: 0;
          height: 100vh;
          overflow: hidden;
        }
        .cos-pre-content {
          flex: 1;
          padding: 24px 32px;
          overflow-y: auto;
          max-width: 1280px;
          width: 100%;
          margin: 0 auto;
          animation: cos-pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .cos-pre-bar {
          background-color: #f1f5f9;
          border-radius: 8px;
        }
        @media (max-width: 768px) {
          .cos-pre-sidebar { display: none; }
        }
      </style>
      <div class="cos-pre-shell" aria-hidden="true">
        <!-- Sidebar -->
        <div class="cos-pre-sidebar">
          <div style="height: 64px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid #f1f5f9; gap: 10px;">
            <div style="width: 32px; height: 32px; border-radius: 8px; background: #2563eb;"></div>
            <div style="width: 100px; height: 18px; border-radius: 6px; background: #1e293b;"></div>
          </div>
          <div style="padding: 16px 12px; display: flex; flex-direction: column; gap: 8px;">
            <div class="cos-pre-bar" style="height: 38px;"></div>
            <div class="cos-pre-bar" style="height: 38px;"></div>
            <div class="cos-pre-bar" style="height: 38px;"></div>
            <div class="cos-pre-bar" style="height: 38px;"></div>
            <div class="cos-pre-bar" style="height: 38px;"></div>
            <div class="cos-pre-bar" style="height: 38px;"></div>
          </div>
        </div>
        <!-- Main Area -->
        <div class="cos-pre-main">
          <div class="cos-pre-topbar">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div style="width: 160px; height: 20px; border-radius: 6px; background: #e2e8f0;"></div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <div style="width: 96px; height: 32px; border-radius: 8px; background: #f1f5f9;"></div>
              <div style="width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0;"></div>
            </div>
          </div>
          <div class="cos-pre-content">
            <div style="height: 32px; width: 220px; border-radius: 8px; background: #e2e8f0; margin-bottom: 16px;"></div>
            <div style="height: 80px; width: 100%; border-radius: 16px; background: #ffffff; border: 1px solid #e2e8f0; margin-bottom: 24px;"></div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px;">
              <div style="height: 160px; border-radius: 16px; background: #ffffff; border: 1px solid #e2e8f0;"></div>
              <div style="height: 160px; border-radius: 16px; background: #ffffff; border: 1px solid #e2e8f0;"></div>
              <div style="height: 160px; border-radius: 16px; background: #ffffff; border: 1px solid #e2e8f0;"></div>
              <div style="height: 160px; border-radius: 16px; background: #ffffff; border: 1px solid #e2e8f0;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
